openapi: 3.0.3
info:
  title: Grocery Store API
  version: 1.0.0
  description: >
    A RESTful API for an online grocery store, supporting product browsing,
    cart management, and order placement. Built for 420-511-VA Web Services.
servers:
  - url: http://localhost:8080/api/v1
    description: Local Development Server

paths:
  /products:
    get:
      summary: Get a list of products
      description: >
        Retrieves a paginated list of products. Supports filtering by
        category and searching by name, plus sorting.
      parameters:
        - in: query
          name: category
          required: false
          schema:
            type: string
          description: Filter products by category name (e.g. "dairy")
        - in: query
          name: search
          required: false
          schema:
            type: string
          description: Search products by name
        - in: query
          name: sort
          required: false
          schema:
            type: string
            enum: [price, name, -price, -name]
          description: Sort field; prefix with "-" for descending
        - in: query
          name: page
          required: false
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: A JSON array of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
    post:
      summary: Add a new product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: Product successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Invalid product data

  /products/{id}:
    get:
      summary: Retrieve a specific product by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The unique identifier of the product
      responses:
        '200':
          description: A single Product object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Product not found
    put:
      summary: Replace a product's details
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '200':
          description: Product successfully updated
        '404':
          description: Product not found
    delete:
      summary: Delete a product
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Product successfully deleted
        '404':
          description: Product not found

  /categories:
    get:
      summary: Get a list of all categories
      responses:
        '200':
          description: A JSON array of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
    post:
      summary: Add a new category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '201':
          description: Category successfully created

  /categories/{id}:
    get:
      summary: Retrieve a specific category by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: A single Category object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '404':
          description: Category not found
    delete:
      summary: Delete a category
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Category successfully deleted
        '404':
          description: Category not found

  /customers:
    post:
      summary: Register a new customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerInput'
      responses:
        '201':
          description: Customer successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          description: Invalid customer data

  /customers/{id}:
    get:
      summary: Retrieve a specific customer by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: A single Customer object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          description: Customer not found
    put:
      summary: Update a customer's details
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerInput'
      responses:
        '200':
          description: Customer successfully updated
        '404':
          description: Customer not found

  /customers/{id}/cart:
    get:
      summary: Retrieve a customer's active cart
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The customer's cart, with line items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '404':
          description: Customer or cart not found

  /customers/{id}/cart/items:
    post:
      summary: Add an item to the customer's cart
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemInput'
      responses:
        '201':
          description: Item added to cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '409':
          description: Requested quantity exceeds available stock

  /customers/{id}/cart/items/{itemId}:
    put:
      summary: Update the quantity of a cart item
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: path
          name: itemId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemInput'
      responses:
        '200':
          description: Cart item updated
        '404':
          description: Cart item not found
    delete:
      summary: Remove an item from the cart
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: path
          name: itemId
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Item removed from cart
        '404':
          description: Cart item not found

  /orders:
    post:
      summary: Place a new order from a customer's cart
      description: >
        Creates an order from the customer's current cart contents. Validates
        stock for each line item and calculates the order total server-side.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderInput'
      responses:
        '201':
          description: Order successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '409':
          description: One or more items are out of stock

  /orders/{id}:
    get:
      summary: Retrieve a specific order by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: A single Order object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Order not found
    patch:
      summary: Update an order's status
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [pending, packed, out_for_delivery, delivered, cancelled]
      responses:
        '200':
          description: Order status updated
        '404':
          description: Order not found

  /customers/{id}/orders:
    get:
      summary: Retrieve a customer's order history
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: query
          name: status
          required: false
          schema:
            type: string
          description: Filter by order status
        - in: query
          name: page
          required: false
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: A JSON array of the customer's orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'

components:
  schemas:
    Product:
      type: object
      properties:
        id:
          type: integer
          example: 101
        name:
          type: string
          example: "Whole Milk 2L"
        price:
          type: number
          format: float
          example: 4.99
        unit:
          type: string
          example: "each"
        stock:
          type: integer
          example: 42
        categoryId:
          type: integer
          example: 3
        imageUrl:
          type: string
          example: "https://example.com/images/milk.jpg"

    ProductInput:
      type: object
      required: [name, price, categoryId]
      properties:
        name:
          type: string
        price:
          type: number
          format: float
        unit:
          type: string
        stock:
          type: integer
        categoryId:
          type: integer
        imageUrl:
          type: string

    Category:
      type: object
      properties:
        id:
          type: integer
          example: 3
        name:
          type: string
          example: "Dairy"

    CategoryInput:
      type: object
      required: [name]
      properties:
        name:
          type: string

    Customer:
      type: object
      properties:
        id:
          type: integer
          example: 7
        firstName:
          type: string
          example: "Will"
        lastName:
          type: string
          example: "Elveus"
        email:
          type: string
          example: "will@example.com"
        address:
          type: string
          example: "123 Rue Principale, Saint-Jerome, QC"
        phone:
          type: string
          example: "450-555-0123"

    CustomerInput:
      type: object
      required: [firstName, lastName, email, password]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        password:
          type: string
          format: password
        address:
          type: string
        phone:
          type: string

    CartItem:
      type: object
      properties:
        id:
          type: integer
          example: 501
        productId:
          type: integer
          example: 101
        quantity:
          type: integer
          example: 2
        unitPrice:
          type: number
          format: float
          example: 4.99

    CartItemInput:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: integer
        quantity:
          type: integer
          minimum: 1

    Cart:
      type: object
      properties:
        id:
          type: integer
          example: 30
        customerId:
          type: integer
          example: 7
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        subtotal:
          type: number
          format: float
          example: 14.97

    OrderItem:
      type: object
      properties:
        productId:
          type: integer
          example: 101
        quantity:
          type: integer
          example: 2
        unitPrice:
          type: number
          format: float
          example: 4.99

    Order:
      type: object
      properties:
        id:
          type: integer
          example: 900
        customerId:
          type: integer
          example: 7
        status:
          type: string
          enum: [pending, packed, out_for_delivery, delivered, cancelled]
          example: "pending"
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        total:
          type: number
          format: float
          example: 14.97
        deliveryAddress:
          type: string
          example: "123 Rue Principale, Saint-Jerome, QC"
        createdAt:
          type: string
          format: date-time
          example: "2026-09-22T14:30:00Z"

    OrderInput:
      type: object
      required: [customerId, deliveryAddress]
      properties:
        customerId:
          type: integer
        deliveryAddress:
          type: string
